<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-light.png" />
    <script src="/iconfont.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuthyIDE 智能开发平台</title>
    <!-- SEO 元标签 -->
    <meta name="description" content="AuthyIDE 是一个 AI 应用开发平台，通过 AI 驱动的编程助手、自动化工作流和 Flutter 跨端打包能力，帮助开发者更快速地构建 Web 与 App 应用。" />
    <meta name="keywords" content="AI应用开发, 智能编程, 开发者工具, 自动化编程, 代码助手, AI开发平台, Flutter, AuthyIDE, 人工智能编程" />
    <meta name="author" content="AuthyIDE" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://authyide.app" />
    <script>
      (function () {
        var theme = "system";

        try {
          theme = localStorage.getItem("authyide-theme") || "system";
        } catch (error) {
          theme = "system";
        }

        var systemTheme = "light";

        try {
          systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        } catch (error) {
          systemTheme = "light";
        }
        var resolvedTheme = window.location.pathname === "/" ? "light" : theme === "system" ? systemTheme : theme;

        if (resolvedTheme !== "dark" && resolvedTheme !== "light") {
          resolvedTheme = "light";
        }

        document.documentElement.classList.remove("light", "dark");
        document.documentElement.classList.add(resolvedTheme);
        document.documentElement.style.colorScheme = resolvedTheme;
      })();
    </script>
    <!-- 必须在所有模块代码之前设置，确保 cap.js 使用本地 WASM 而非 CDN（jsdelivr.net 在国内不稳定） -->
    <script>window.CAP_CUSTOM_WASM_URL = location.origin + "/captcha/cap_wasm.js";</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
